name: Windows build and release

on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish MiniChroma.exe
        working-directory: windows/src/MiniChroma.Windows
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: windows/installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" MiniChroma.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: MiniChroma-Setup
          path: windows/installer-output/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/installer-output/*.exe
          prerelease: true
          body: |
            Early Windows build of MiniChroma. Needs OpenRGB running with its SDK server enabled.
            Not yet tested on hardware. Please report what works and what doesn't.
